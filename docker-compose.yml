# Local development MongoDB. Runs as a single-node replica set so transactions work
# (needed later for module re-ordering). Not used in production (MongoDB Atlas).
services:
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mongo-data:
