name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      FEATURE_PHISHING: 'false'
      FEATURE_CONTINUOUS_REVIEW: 'false'
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Electron and MongoDB binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ${{ github.workspace }}/.cache/mongodb-binaries
          key: ${{ runner.os }}-bins-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Electron e2e (Windows)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The harness (server/src/testing/e2eServer.ts) refuses to start unless NODE_ENV=test and
      # CSENSE_E2E_HARNESS=1 (set by the Playwright globalSetup). ADR 0018.
      NODE_ENV: test
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}\.cache\mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ${{ github.workspace }}\.cache\mongodb-binaries
          key: ${{ runner.os }}-e2e-bins-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      # The e2e harness is not part of the production build (P5-I6); it is emitted separately.
      - run: npm run build:e2e -w @csense/server
      - run: npm run test:e2e
      # Rebuilds the desktop app in styleguide mode and runs axe (incl. colour contrast) in Electron.
      # The plain test:e2e run above skips this spec because the production build has no styleguide.
      - name: Accessibility gate (axe on the styleguide build)
        run: npm run test:a11y -w @csense/desktop
        env:
          CSENSE_REQUIRE_STYLEGUIDE: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: desktop/playwright-report
          retention-days: 7
